name: Semi-Annual Glacier Mapper Export

on:
  schedule:
    # Run on December 31st and June 30th at 02:00 UTC (every 6 months)
    - cron: '0 2 30 6 *'
    - cron: '0 2 31 12 *'
  
  workflow_dispatch:  # Allow manual triggering
    inputs:
      test_mode:
        description: 'Run in test mode (single basin)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.10'

jobs:
  export-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up Google Earth Engine credentials
      run: |
        if [ -z "${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "❌ ERROR: GEE_SERVICE_ACCOUNT_KEY secret is not set"
          echo "Please add the secret in repository Settings > Secrets and variables > Actions"
          echo "Secret name: GEE_SERVICE_ACCOUNT_KEY"
          echo "Secret value: Complete contents of thurgau-irrigation-4767961f11f5.json"
          exit 1
        fi
        echo '${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}' > thurgau-irrigation-4767961f11f5.json
        export GOOGLE_APPLICATION_CREDENTIALS="thurgau-irrigation-4767961f11f5.json"
        echo "✅ Service account credentials configured"
    
    - name: Run validation tests first
      run: python Github_Actions/test_validate.py
    
    - name: Run export (test mode)
      if: ${{ github.event.inputs.test_mode == 'true' }}
      run: python Github_Actions/test_mode.py
      env:
        GOOGLE_APPLICATION_CREDENTIALS: thurgau-irrigation-4767961f11f5.json
    
    - name: Run full export
      if: ${{ github.event.inputs.test_mode != 'true' }}
      run: python Github_Actions/run_export.py
      env:
        GOOGLE_APPLICATION_CREDENTIALS: thurgau-irrigation-4767961f11f5.json
    
    - name: Clean up credentials
      if: always()
      run: rm -f thurgau-irrigation-4767961f11f5.json
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Semi-Annual Export Failed',
            body: `The semi-annual glacier mapper export failed on ${new Date().toISOString()}.\n\nPlease check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            labels: ['bug', 'automated']
          })